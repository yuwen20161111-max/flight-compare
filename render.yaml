services:
  - type: web
    name: flight-compare
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app --bind 0.0.0.0:$PORT --workers 1 --timeout 120 --preload
    healthCheckPath: /
    envVars:
      - key: TRAVELPAYOUTS_TOKEN
        sync: false
